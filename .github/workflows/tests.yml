name: Tests

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install core package and test runner
        run: python -m pip install -e ".[dev]"
      - name: Run CPU geometry, registration, and localization tests
        run: python -m pytest -q tests/test_geometry.py tests/test_scale_stitch.py tests/test_align_pf.py
